name: banco_fin_tech
description: BancoFinTech - Aplicativo bancário moderno com Flutter e Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Estado
  flutter_riverpod: ^2.6.1

  # Rede / AwesomeAPI
  dio: ^5.4.0

  # Plugins do app
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.0
  mobile_scanner: ^5.0.0
  share_plus: ^10.0.0
  image_picker: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700